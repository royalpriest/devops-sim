# Render Blueprint: one free web service built from the Dockerfile.
# The free plan has no persistent disk, so saved runs are lost on each deploy or
# restart. That's fine for a simulator, since every run starts fresh anyway.
services:
  - type: web
    name: devops-sim
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true
      # One Puma process: Action Cable's async adapter only reaches clients
      # connected to the same process, and the free plan has 512 MB.
      - key: WEB_CONCURRENCY
        value: "0"
