name: CI

on:
  pull_request:
  push:
    branches: [ main ]

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: Security scan
        run: bin/brakeman --no-pager

      - name: Gem audit
        run: bin/bundler-audit

      - name: Lint
        run: bin/rubocop -f github

      - name: Tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test
