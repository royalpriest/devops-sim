name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: Security scan
        run: bin/brakeman --no-pager

      - name: Gem audit
        run: bin/bundler-audit

      - name: Lint
        run: bin/rubocop -f github

      - name: Tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the production image
        run: docker build -t devops-sim .

      - name: Start it and check that it serves the app
        run: |
          docker run -d --name app -p 3000:3000 -e SECRET_KEY_BASE=ci-only-secret devops-sim
          for i in $(seq 1 30); do curl -sf http://localhost:3000/up && break; sleep 1; done
          curl -sf -H 'X-Forwarded-Proto: https' http://localhost:3000/ | grep -q '<div id="root">'
          curl -sf -H 'X-Forwarded-Proto: https' http://localhost:3000/api/scenarios | grep -q github-first-pr
      - if: failure()
        run: docker logs app || true
